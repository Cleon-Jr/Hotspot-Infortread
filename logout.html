<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Internet hotspot - Log out</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="css/others.css">
    <script>
        function openLogin() {
            if (window.name != 'hotspot_logout') return true;
            open('$(link-login)', '_blank', '');
            window.close();
            return false;
        }
    </script>
</head>

<body>
    <div class="card col-md-4">
        <div class="card-header">
            <img class="img-fluid mx-auto d-block" src="./img/CidadeDigital-logo.png">
            <h1 class="text-center">Você acabou de sair!</h1>
        </div>
        <div class="card-body">
            <table>
                <tr>
                    <td>Seu CPF</td>
                    <td>$(username)</td>
                </tr>
                <tr>
                    <td>Endereço IP</td>
                    <td>$(ip)</td>
                </tr>
                <tr>
                    <td>Endereço Físico</td>
                    <td>$(mac)</td>
                </tr>
                <tr>
                    <td>Tempo de Acesso</td>
                    <td>$(uptime)</td>
                </tr>
                <!-- $(if session-time-left)
                    <tr>
                        <td>Time left</td>
                        <td>$(session-time-left)</td>
                    </tr>
                    $(endif) -->
                <tr>
                    <td>Bytes up / down:</td>
                    <td>$(bytes-in-nice) / $(bytes-out-nice)</td>
                </tr>
            </table>
        </div>
        <div class="card-footer">
            <form action="$(link-login)" name="login" onSubmit="return openLogin()">
                <div class="d-grid">
                    <input type="submit" class="btn btn-success btn-block" value="Entrar">
                </div>
            </form>
            <br>
            <p class="text-center">Produzido por Infortread Sistemas</p>
            <img id="#lgTread" class="mx-auto d-block" src="./img/logo-w.png">
            <p class="text-center"><a href="tel:08004561010">Contato 0800 456 1010</a></p>
        </div>
    </div>

</body>

</html>
